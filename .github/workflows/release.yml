name: Release

# Triggered by pushing a version tag:
#   vX.Y.Z-rc.N on develop -> test build (prerelease, test channel)
#   vX.Y.Z      on main    -> production release
# A merge into develop whose commit message contains "[test-release]" also builds the next
# test build vX.Y.Z-rc.N (N = highest existing rc + 1), so test builds need no manual tag.
# (workflow_dispatch on main or develop does the same.)
on:
  push:
    tags: ["v*"]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Work out version and channel
        id: v
        run: |
          base="$(cat VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            case "$v" in
              *-rc.*|*-test.*) ch=test; section=Unreleased ;;
              *) ch=production; section="$v" ;;
            esac
            [ "${v%%-*}" = "$base" ] || { echo "Tag $v does not match VERSION $base" >&2; exit 1; }
          else
            case "$GITHUB_REF_NAME" in
              main)    v="$base"; ch=production; section="$base" ;;
              develop)
                last="$(git tag -l "v$base-rc.*" | sed "s/^v$base-rc\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)"
                v="$base-rc.$(( ${last:-0} + 1 ))"; ch=test; section=Unreleased ;;
              *) echo "Releases are only built from main or develop" >&2; exit 1 ;;
            esac
          fi
          { echo "version=$v"; echo "channel=$ch"; echo "section=$section"; } >> "$GITHUB_OUTPUT"
      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Package
        run: bash scripts/package.sh "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.channel }}" "$GITHUB_SHA"
      - name: Release notes
        run: bash scripts/release-notes.sh "${{ steps.v.outputs.section }}" > notes.md && cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          flags=()
          [ "${{ steps.v.outputs.channel }}" = test ] && flags+=(--prerelease --title "Test build $v") || flags+=(--latest --title "Stats Collector $v")
          assets=("dist/stats-collector-$v.tar.gz" "dist/stats-collector-$v.tar.gz.sha256")
          if gh release view "v$v" >/dev/null 2>&1; then
            # Release made by hand on GitHub (which pushed the tag): fill in notes and assets.
            gh release edit "v$v" --notes-file notes.md "${flags[@]}"
            gh release upload "v$v" --clobber "${assets[@]}"
          else
            gh release create "v$v" --verify-tag=false --target "$GITHUB_SHA" --notes-file notes.md "${flags[@]}" "${assets[@]}"
          fi

  # Manual on GitHub Pages, one version per release (mike), with fresh screenshots.
  docs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start the app with example settings
        run: |
          pip install -q -e backend -r docs/requirements.txt
          (cd frontend && npm ci --no-audit --no-fund && npm run build && npx playwright install --with-deps chromium)
          export SC_CONFIG_FILE=/nonexistent SC_DATABASE_URL=sqlite:///$RUNNER_TEMP/shots.db SC_DATA_DIR=$RUNNER_TEMP/var
          stats-collector migrate
          stats-collector demo-data
          echo "SETUP_LINK=$(SC_PUBLIC_URL=http://127.0.0.1:8080 stats-collector setup-link)" >> "$GITHUB_ENV"
          nohup uvicorn stats_collector.main:app --app-dir backend --port 8080 > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 1; done
          # The live wall screenshot needs the wall service as well.
          nohup uvicorn stats_collector.livewall.app:app --app-dir backend --port 8081 > "$RUNNER_TEMP/wall.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8081/ && break; sleep 1; done
        env:
          SC_CONFIG_FILE: /nonexistent
      - name: Screenshots
        working-directory: frontend
        run: node scripts/screenshots.mjs http://127.0.0.1:8080 "$SETUP_LINK"
      - name: Publish manual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          v="${{ needs.release.outputs.version }}"
          if [ "${{ needs.release.outputs.channel }}" = production ]; then
            mike deploy --push --update-aliases "$v" latest && mike set-default --push latest
          else
            mike deploy --push --update-aliases "$v" test
            git ls-remote --exit-code origin gh-pages >/dev/null && (mike list | grep -q latest || mike set-default --push test)
          fi
