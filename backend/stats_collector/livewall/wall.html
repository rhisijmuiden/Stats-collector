<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  /* The wall is laid out on a 1920 x 1080 stage that is scaled to fit any screen. What it shows comes
     from the wall's design (services/walldesign.py): screens of blocks on a 12 x 8 grid that take
     turns. The same page is the live preview in the Wall Designer (it then gets its data by message). */
  :root {
    --bg: #060B16; --glow: #2FB8FF; --text: #D8F3FF; --dim: rgba(216, 243, 255, 0.58); --faint: rgba(216, 243, 255, 0.28);
    --good: #3CCB7F; --bad: #FF6B6F; --warn: #FFB86B;
    --display: "Space Grotesk", Inter, system-ui, sans-serif; --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
  #stage.bg-neon { background: radial-gradient(1200px 520px at 12% -12%, color-mix(in srgb, var(--glow) 20%, transparent), transparent 62%),
                radial-gradient(1000px 560px at 100% 112%, color-mix(in srgb, #E14FD0 13%, transparent), transparent 62%), var(--bg); }
  #stage.bg-neon::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(color-mix(in srgb, var(--glow) 6%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--glow) 6%, transparent) 1px, transparent 1px);
    background-size: 64px 64px; -webkit-mask-image: linear-gradient(to bottom, black, transparent 72%); mask-image: linear-gradient(to bottom, black, transparent 72%); }
  #stage.bg-aurora { background: radial-gradient(900px 600px at 80% 0%, color-mix(in srgb, #2CC4B0 28%, transparent), transparent 60%),
                radial-gradient(1100px 600px at 0% 100%, color-mix(in srgb, #6C5CE7 30%, transparent), transparent 60%), var(--bg); }
  .pg { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 0.9s ease, visibility 0s linear 0.9s; }
  .pg.on { opacity: 1; visibility: visible; transition: opacity 0.9s ease; }
  .blk { position: absolute; min-width: 0; }
  .card { border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); background: rgba(10,18,34,0.78); padding: 22px 28px; overflow: hidden; display: flex; flex-direction: column; }
  .num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 0.92; }
  .lbl { font: 600 18px var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { font: 700 15px var(--mono); letter-spacing: 0.06em; padding: 4px 10px; border-radius: 7px; border: 1px solid currentColor; white-space: nowrap; }
  .pill { font: 700 20px var(--mono); padding: 4px 12px; border-radius: 999px; white-space: nowrap; color: var(--dim); background: rgba(255,255,255,0.06); }
  .pill.up { color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }
  .pill.down { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; position: relative; z-index: 1; min-width: 0; }
  .livedot { flex: none; width: 18px; height: 18px; border-radius: 50%; background: #FF3B5C; animation: ping 1.6s infinite; }
  .livedot.off { background: #556; animation: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255,59,92,0.7); } 80%, 100% { box-shadow: 0 0 0 18px rgba(255,59,92,0); } }
  svg.sp { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; pointer-events: none; }
  .empty { flex: 1; display: grid; place-items: center; color: var(--faint); font-size: 26px; text-align: center; }

  /* header */
  .b-header { display: flex; align-items: center; justify-content: space-between; gap: 32px; padding: 0 4px; }
  .b-header .brand { display: flex; align-items: center; gap: 22px; min-width: 0; }
  .b-header h1 { margin: 0; font: 700 58px var(--display); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-header .app { font: 500 21px var(--body); color: var(--dim); letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; }
  .b-header .clock { font: 600 90px var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; text-shadow: 0 0 30px color-mix(in srgb, var(--glow) 50%, transparent); white-space: nowrap; }

  /* big number */
  .b-kpi { border-radius: 22px; padding: 26px 32px; border: 1px solid color-mix(in srgb, var(--a) 30%, transparent); overflow: hidden;
    background: linear-gradient(160deg, color-mix(in srgb, var(--a) 13%, transparent), rgba(6,11,22,0.35) 62%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  .b-kpi .sub { color: var(--faint); font: 500 17px var(--body); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-kpi .num { margin-top: 14px; position: relative; z-index: 1; text-shadow: 0 0 40px color-mix(in srgb, var(--a) 55%, transparent); }
  .b-kpi.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .b-kpi.center .row { justify-content: center; }
  .b-kpi .gauge { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); }
  .b-kpi .gauge path.v { transition: stroke-dashoffset 1.2s ease; }

  /* channel tiles */
  .tiles { display: grid; gap: 22px; width: 100%; height: 100%; }
  .tile { position: relative; overflow: hidden; border-radius: 20px; padding: 22px 26px; border: 1px solid rgba(255,255,255,0.07); min-width: 0;
    background: radial-gradient(420px 220px at 0% 0%, color-mix(in srgb, var(--c) 26%, transparent), transparent 70%), rgba(10,18,34,0.82); }
  .tile .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .tile .name { display: flex; gap: 12px; align-items: center; font: 600 25px var(--display); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .name i, .key i, .lst i { flex: none; width: 14px; height: 14px; border-radius: 4px; background: var(--c); box-shadow: 0 0 16px var(--c); }
  .tile .chip { color: var(--c); }
  .tile .chip.old { color: var(--warn); }
  .tile .chip.off { color: var(--faint); }
  .tile .mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 16px; position: relative; z-index: 1; }
  .tile .unit { font: 500 18px var(--body); color: var(--dim); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .fol { font: 600 16px var(--mono); color: var(--dim); margin-top: 6px; white-space: nowrap; }
  .tile .fol b { color: var(--good); } .tile .fol b.down { color: var(--bad); }
  .tile svg.sp { opacity: 0.8; }
  .ring { flex: none; width: 88px; height: 88px; position: relative; margin-bottom: 22px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle.v { transition: stroke-dashoffset 1.2s ease; }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 19px var(--mono); }
  .ring small { position: absolute; left: -20px; right: -20px; bottom: -22px; text-align: center; font: 600 12px var(--body); letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; }
  .bars3d { flex: 1; display: flex; align-items: flex-end; gap: 28px; padding: 14px 6px 0; min-height: 0; }
  .bars3d > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 10px; min-width: 0; }
  .bars3d b { width: 100%; border-radius: 12px 12px 4px 4px; transition: height 1.2s cubic-bezier(.2,.8,.2,1);
    background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 22%, transparent)); box-shadow: 0 0 30px color-mix(in srgb, var(--c) 50%, transparent); }
  .bars3d .num { font-size: 38px; }
  .bars3d small { font: 600 16px/1.2 var(--body); color: var(--dim); text-align: center; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; min-height: 2.4em; }
  .lst { display: grid; gap: 12px; margin-top: 16px; }
  .lst > div { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 14px; align-items: center; font: 600 26px var(--display); }
  .lst span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lst .num { font-size: 30px; }
  .lst small { font: 500 16px var(--body); color: var(--dim); margin-left: 8px; }

  /* chart */
  .chart { flex: 1; min-height: 0; position: relative; margin-top: 12px; }
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; }
  .key { display: flex; align-items: center; gap: 9px; font: 600 17px var(--body); color: var(--dim); white-space: nowrap; }
  .key i { width: 12px; height: 12px; }

  /* ticker */
  .b-ticker { border-radius: 16px; border: 1px solid color-mix(in srgb, var(--a) 25%, transparent); background: color-mix(in srgb, var(--a) 6%, transparent); overflow: hidden; display: flex; align-items: center; }
  .b-ticker .tag { position: relative; z-index: 2; flex: none; height: 100%; display: flex; align-items: center; padding: 0 24px; font: 700 18px var(--mono); letter-spacing: 0.12em; color: var(--bg); background: var(--a); box-shadow: 14px 0 24px var(--bg); }
  .b-ticker .track { display: flex; gap: 72px; white-space: nowrap; padding-left: 48px; font: 500 24px var(--body); animation: marquee var(--dur, 60s) linear infinite; }
  .b-ticker .track b { font-family: var(--display); }
  .b-ticker .track .k { font: 700 17px var(--mono); }
  .b-ticker .track .au { color: var(--dim); }
  @keyframes marquee { to { transform: translateX(-50%); } }

  /* race */
  .race { position: relative; flex: 1; min-width: 0; margin-top: 16px; }
  .rr { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: center; transition: top 0.9s cubic-bezier(.2,.8,.2,1), opacity 0.6s; }
  .rr .pos { font: 700 40px var(--mono); color: var(--faint); text-align: right; }
  .rr .pos.top3 { color: var(--text); }
  .rr .track { position: relative; height: 100%; min-width: 0; }

  .rr .fill::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 40%; max-width: 90px; border-radius: 0 14px 14px 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 60%, white)); opacity: 0.55; }
  .race.plain .fill { display: none; }
  .race.plain .track { border-bottom: 1px solid rgba(255,255,255,0.08); }
  .rr .txt { position: absolute; left: 18px; right: 210px; top: 0; bottom: 0; display: flex; align-items: center; gap: 16px; min-width: 0; }
  .rr .k { flex: none; font: 700 15px var(--mono); padding: 5px 9px; border-radius: 6px; background: var(--c); color: #050A14; }
  .rr .tt { font: 600 25px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .rr .au { font: 500 18px var(--body); color: color-mix(in srgb, var(--text) 66%, transparent); white-space: nowrap; flex: none; }
  .rr .val { position: absolute; right: 12px; top: 0; bottom: 0; display: flex; align-items: center; gap: 10px; }
  .rr .val .num { font-size: 40px; }
  .rr .mv { font: 700 18px var(--mono); width: 48px; text-align: center; color: var(--faint); }
  .rr .mv.up { color: var(--good); } .rr .mv.dn { color: var(--bad); }
  .b-race .ttl { font: 700 44px var(--display); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-race .ttl em { font-style: normal; color: var(--a); }
  .b-race { background: transparent; border: 0; padding: 0; }

  /* risers, goals */
  .mom { display: grid; gap: 12px; margin-top: 14px; }
  .mom div { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
  .mom .k { font: 700 13px var(--mono); padding: 4px 8px; border-radius: 6px; background: var(--c); color: #050A14; }
  .mom .tt { font: 600 20px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mom b { font: 700 21px var(--mono); color: var(--good); }
  .goals { margin-top: 14px; }
  .goal { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
  .goal + .goal { margin-top: 18px; }
  .goal .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 600 21px var(--display); }
  .goal .gh span:first-child { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .goal .gh span:last-child { font: 500 17px var(--mono); color: var(--dim); white-space: nowrap; }
  .goal .gb { position: relative; height: 16px; border-radius: 8px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .goal .gb b { position: absolute; inset: 0 auto 0 0; border-radius: 8px; transition: width 1.2s; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 40%, transparent), var(--c)); box-shadow: 0 0 16px var(--c); overflow: hidden; }
  .goal .gb b::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent); animation: shine 2.8s infinite; transform: translateX(-100%); }
  @keyframes shine { to { transform: translateX(100%); } }
  .goal small, .rings small { font: 500 16px var(--body); color: var(--dim); }
  .goal small.good, .rings small.good { color: var(--good); } .goal small.bad, .rings small.bad { color: var(--warn); }
  .key b { color: var(--text); font-family: var(--mono); }
  .rings { display: flex; flex-wrap: wrap; gap: 18px 28px; margin-top: 16px; align-content: flex-start; }
  .rings > div { display: grid; justify-items: center; gap: 6px; text-align: center; width: 150px; }
  .rings svg { width: 120px; height: 120px; transform: rotate(-90deg); }
  .rings b { font: 600 18px var(--display); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* message */
  .b-msg { justify-content: center; }
  .b-msg .big { font: 700 64px var(--display); letter-spacing: -0.02em; line-height: 1.05; text-wrap: balance; }
  .b-msg .small { font: 500 26px var(--body); color: var(--dim); margin-top: 14px; }

  /* footer: freshness and which screen is next */
  footer { position: absolute; left: 64px; right: 64px; bottom: 12px; height: 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; font: 500 16px var(--body); color: var(--dim); }
  .stale { color: var(--warn); }
  .dots { display: flex; gap: 10px; align-items: center; }
  .dots i { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; display: block; }
  .dots i b { display: block; height: 100%; width: 0; background: var(--glow); box-shadow: 0 0 10px var(--glow); }
  @media (prefers-reduced-motion: reduce) {
    .livedot, .b-ticker .track, .goal .gb b::after { animation: none; }
    .pg, .rr, .rr .fill, .ring circle.v, .goal .gb b, .bars3d b { transition: none; }
  }
</style>

        track.style.setProperty("--dur", Math.max(30, top.slice(0, 8).length * 9) + "s");
      }
      return top.length > 0;
    } };
  };

  BLOCKS.race = function (b, box) {
    var plainList = b.viz === "list";
    var node = el('<div class="card b-race" style="--a:' + esc(accent(b)) + '"><div class="ttl"></div><div class="race' + (plainList ? " plain" : "") + '"></div></div>');
    var rows = {}, lastRank = {};
    return { node: node, update: function () {
      var top = picked(b, data.top || [], "source_id"), race = node.querySelector(".race");
      var space = box.h - 76, rowH = Math.min(84, space / Math.max(1, Math.min(b.rows || 8, top.length || 1)));
      var fit = Math.max(1, Math.floor(space / Math.max(56, rowH)));
      top = top.slice(0, Math.min(b.rows || 8, fit));
      var yesterday = data.top_day && data.today && data.top_day !== data.today;
      node.querySelector(".ttl").innerHTML = b.title ? esc(b.title) : yesterday ? T.storiesYesterday : T.storiesToday;
      var maxV = Math.max.apply(null, top.map(function (t) { return t.value; }).concat([1]));
      var seen = {};
      top.forEach(function (t, i) {
        var key = String(t.id); seen[key] = true;
        var r = rows[key];
        if (!r) {
          r = el('<div class="rr" style="top:' + (i * rowH) + 'px"><span class="pos"></span><div class="track"><div class="fill" style="width:0"></div>' +
            '<div class="txt"><span class="k"></span><span class="tt"></span><span class="au"></span></div><div class="val"><span class="num">0</span><span class="mv"></span></div></div></div>');
          race.appendChild(r); rows[key] = r;
        }
        r.style.setProperty("--c", colorFor(b, t.color));
        r.style.height = (rowH - 10) + "px"; r.style.top = (i * rowH) + "px"; r.style.opacity = "1";
        var pos = r.querySelector(".pos"); pos.textContent = i + 1; pos.className = "pos" + (i < 3 ? " top3" : "");
        r.querySelector(".k").textContent = kindTag(t.kind);
        r.querySelector(".tt").textContent = t.title;
        r.querySelector(".au").textContent = b.editors === false ? "" : t.author || "";
        r.querySelector(".fill").style.width = (28 + t.value / maxV * 72) + "%";
        count(r.querySelector(".num"), t.value, b.countup);
        var prev = lastRank[key], mv = r.querySelector(".mv");
        if (prev == null || prev === i) { mv.className = "mv"; mv.textContent = "–"; }
        else { mv.className = "mv " + (prev > i ? "up" : "dn"); mv.textContent = (prev > i ? "▲" : "▼") + Math.abs(prev - i); }
      });
      Object.keys(rows).forEach(function (k) { if (!seen[k]) { rows[k].remove(); delete rows[k]; } });
      lastRank = {}; top.forEach(function (t, i) { lastRank[String(t.id)] = i; });
      return top.length > 0;
    } };
  };

  BLOCKS.risers = function (b) {
    var node = el('<div class="card"><div class="lbl"></div><div class="mom"></div></div>');
    return { node: node, update: function () {
      var rising = picked(b, data.rising || [], "source_id").slice(0, b.rows || 4);
      node.querySelector(".lbl").textContent = b.title || T.rising;
      node.querySelector(".mom").innerHTML = rising.length ? rising.map(function (t) {
        return '<div style="--c:' + esc(colorFor(b, t.color)) + '"><span class="k">' + esc(kindTag(t.kind)) + '</span><span class="tt">' + esc(t.title) + "</span><b>+" + esc(fmt(t.gain)) + "</b></div>";
      }).join("") : '<div class="empty" style="display:block;font-size:22px">' + esc(T.noData) + "</div>";
      return rising.length > 0;
    } };
  };

  function goalNote(g) {
    var bad = g.status === "behind" ? ' class="bad"' : "";
    if (g.status === "reached") return '<small class="good">✓ ' + esc(T.reached) + "</small>";
    if (g.period && g.period !== "none") return "<small" + bad + ">" + esc(T[g.period]) + " · " + esc(g.status === "behind" ? T.behind : T.onTrack) + "</small>";
    if (g.eta) return "<small" + bad + ">" + esc(T.expected) + " " + esc(new Date(g.eta).toLocaleDateString(lang, { day: "numeric", month: "short", year: "numeric" })) + (g.status === "behind" ? " · " + esc(T.behind) : "") + "</small>";
    return "<small" + bad + ">" + esc(g.status === "behind" ? T.behind : T.onTrack) + "</small>";
  }
  BLOCKS.goals = function (b, bx) {
    var ring = Math.round(Math.max(64, Math.min(120, bx.h - 175)));
    var node = el('<div class="card"><div class="lbl"></div><div class="goals"></div></div>');
    return { node: node, update: function () {
      var chosen = b.channels || [];
      var goals = (data.goals || []).filter(function (g) {
        return !chosen.length || (g.source_ids.length && g.source_ids.every(function (i) { return chosen.indexOf(i) >= 0; }));
      }).slice(0, b.viz === "rings" ? Math.min(b.rows || 3, Math.max(1, Math.floor((bx.w - 56) / (ring + 68)))) : Math.min(b.rows || 3, Math.max(1, Math.floor((bx.h - 70) / 96))));
      var byId = {}; (data.sources || []).forEach(function (s) { byId[s.id] = s; });
      node.querySelector(".lbl").textContent = b.title || T.goals;
      var color = function (g) { var one = g.source_ids.length === 1 && byId[g.source_ids[0]]; return colorFor(b, one ? one.color : glow()); };
      var box = node.querySelector(".goals");
      if (!goals.length) { box.innerHTML = '<div class="empty" style="display:block;font-size:22px">' + esc(T.noData) + "</div>"; return false; }
      if (b.viz === "rings") {
        box.className = "rings";
        box.innerHTML = goals.map(function (g) {
          var f = Math.max(0, Math.min(1, g.progress / 100)), c = color(g);
          return '<div style="width:' + (ring + 40) + 'px"><svg viewBox="0 0 100 100" style="width:' + ring + "px;height:" + ring + 'px"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="' + esc(c) + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="' + (251.3 * (1 - f)).toFixed(1) + '" style="filter:drop-shadow(0 0 6px ' + esc(c) + ')"/>' +
            '<text x="50" y="57" text-anchor="middle" transform="rotate(90 50 50)" fill="var(--text)" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20">' + Math.round(f * 100) + "%</text></svg><b>" + esc(g.name) + "</b><small" + (g.status === "behind" ? ' class="bad"' : g.status === "reached" ? ' class="good"' : "") + ">" + esc(g.status === "reached" ? T.reached : g.status === "behind" ? T.behind : T.onTrack) + "</small></div>";
        }).join("");
      } else {
        box.className = "goals";
        box.innerHTML = goals.map(function (g) {
          return '<div class="goal" style="--c:' + esc(color(g)) + '"><div class="gh"><span>' + esc(g.name) + "</span><span>" + esc(plain.format(g.current)) + " / " + esc(plain.format(g.target)) +
            '</span></div><div class="gb"><b style="width:' + Math.max(2, Math.min(100, g.progress)) + '%"></b></div>' + goalNote(g) + "</div>";
        }).join("");
      }
      return true;
    } };
  };

  BLOCKS.msg = function (b, box) {
    var c = b.color && b.color !== "auto" ? b.color : "var(--text)";
    var node = el('<div class="card b-msg"><div class="big"></div><div class="small"></div></div>');
    var big = node.querySelector(".big");
    big.style.color = c; big.style.fontSize = Math.round(Math.max(30, Math.min(96, box.h * 0.32, box.w * 0.06))) + "px";
    return { node: node, update: function () {
      big.textContent = b.text || T.msg;
      node.querySelector(".small").textContent = b.sub || "";
      node.querySelector(".small").hidden = !b.sub;
      return null;
    } };
  };

  /* ---------- screens ---------- */
  var built = null, screens = [], current = -1, startedAt = 0, pinned = (/[?&]screen=([a-z0-9-]+)/.exec(location.search) || [])[1];
  var HIDE_EMPTY = { risers: true, goals: true, ticker: true };
  function boxOf(b) { return { x: PAD + b.x * (CW + GAP), y: PAD + b.y * (CH + GAP), w: b.w * CW + (b.w - 1) * GAP, h: b.h * CH + (b.h - 1) * GAP }; }
  function build(design) {
    var host = $("screens"); host.innerHTML = ""; screens = [];
    (design.screens || []).forEach(function (s) {
      var pg = el('<section class="pg"></section>'), blocks = [];
      (s.blocks || []).forEach(function (b) {
        var make = BLOCKS[b.type]; if (!make) return;
        var box = boxOf(b), blk = make(b, box), wrap = el('<div class="blk"></div>');
        wrap.style.cssText = "left:" + box.x + "px;top:" + box.y + "px;width:" + box.w + "px;height:" + box.h + "px";
        if (blk.node.classList.contains("card") || blk.node.classList.contains("b-kpi") || blk.node.classList.contains("b-header")) blk.node.style.cssText += ";width:100%;height:100%";
        blk.wrap = wrap; blk.type = b.type;
        wrap.appendChild(blk.node); pg.appendChild(wrap); blocks.push(blk);
      });
      host.appendChild(pg);
      screens.push({ def: s, node: pg, blocks: blocks, hasData: true });
    });
    current = -1;
  }
  function playable() {
    var list = screens.map(function (s, i) { return i; });
    if (pinned) { var p = list.filter(function (i) { return screens[i].def.id === pinned; }); if (p.length) return p; }
    var withData = list.filter(function (i) { return screens[i].hasData; });
    return withData.length ? withData : list.slice(0, 1);
  }
  function show(i) {
    current = i; startedAt = performance.now();
    screens.forEach(function (s, n) { s.node.classList.toggle("on", n === i); });
    stage.className = "bg-" + ((screens[i] && screens[i].def.background) || "neon");
    drawDots();
  }
  function drawDots() {
    var list = playable(), dots = $("dots");
    if (list.length < 2 || PREVIEW) { dots.innerHTML = ""; return; }
    dots.innerHTML = list.map(function (n) { return "<i><b" + (n === current ? ' id="bar"' : "") + "></b></i>"; }).join("");
  }
  function rotate() {
    if (!screens.length) return;
    var list = playable(), secs = Math.max(10, (screens[current] && screens[current].def.seconds) || 30);
    if (list.indexOf(current) < 0) show(list[0]);
    else if (!PREVIEW && list.length > 1 && performance.now() - startedAt >= secs * 1000) show(list[(list.indexOf(current) + 1) % list.length]);
    var bar = $("bar");
    if (bar) bar.style.width = Math.min(100, (performance.now() - startedAt) / (secs * 10)) + "%";
  }

  // Headings and body text use the brand's fonts (Administration → Branding), loaded from Google Fonts.
  var fontsKey = null;
  function applyFonts(fonts) {
    var key = JSON.stringify(fonts || {});
    if (key === fontsKey) return;
    fontsKey = key;
    var load = [];
    [["heading", "--display"], ["body", "--body"]].forEach(function (r) {
      var f = fonts && fonts[r[0]], fam = f && String(f.family || "");
      if (!fam || !/^[A-Za-z0-9 ]{2,60}$/.test(fam)) return;
      rootStyle.setProperty(r[1], '"' + fam + '", ' + (r[0] === "heading" ? "Inter, " : "") + "system-ui, sans-serif");
      if (["Inter", "Space Grotesk", "JetBrains Mono"].indexOf(fam) < 0) load.push("family=" + fam.replace(/ /g, "+") + ":wght@400;500;600;700;800;900");
    });
    if (load.length) {
      var link = document.createElement("link");
      link.rel = "stylesheet"; link.href = "https://fonts.googleapis.com/css2?" + load.join("&") + "&display=swap";
      document.head.appendChild(link);
    }
  }

  function render(d) {
    data = d;
    applyFonts(d.fonts);
    var colors = d.colors || {};
    if (colors.background) rootStyle.setProperty("--bg", colors.background);
    if (colors.glow) rootStyle.setProperty("--glow", colors.glow);
    if (colors.text) rootStyle.setProperty("--text", colors.text);
    if (!PREVIEW) document.title = d.title;
    d.channels = d.channels || []; d.sources = d.sources || [];
    var key = JSON.stringify(d.design || {}) + "|" + lang + "|" + (colors.glow || "");
    if (key !== built) { built = key; build(d.design || { screens: [] }); }
    screens.forEach(function (s) {
      var flags = s.blocks.map(function (b) {
        var f; try { f = b.update(); } catch (e) { f = false; }
        // On the TV an empty side box disappears; the designer's preview keeps it to place it.
        if (HIDE_EMPTY[b.type]) b.wrap.style.visibility = f === false && !PREVIEW ? "hidden" : "";
        return f;
      }).filter(function (f) { return f !== null; });
      s.hasData = !flags.length || flags.some(Boolean);
    });
    var list = playable();
    if (list.indexOf(current) < 0) show(list[0]); else drawDots();
    tick();
  }

  function tick() {
    if (!data) return;
    var now = new Date();
    var clock = now.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" });
    document.querySelectorAll(".clock").forEach(function (c) { c.textContent = clock; });
    var at = new Date(data.at), age = (now - at) / 1000, u = $("updated");
    u.textContent = age > 300 && !PREVIEW ? T.stale : T.updated + " " + at.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + " · " + T.note;
    u.className = age > 300 && !PREVIEW ? "stale" : "";
  }

  setInterval(tick, 1000);
  setInterval(rotate, 250);
  if (PREVIEW) {
    // The Wall Designer sends {type: "wall", data, design, screen, lang}.
    window.addEventListener("message", function (e) {
      if (e.origin !== location.origin || !e.data || e.data.type !== "wall") return;
      if (e.data.lang) setLang(e.data.lang === "nl");
      pinned = e.data.screen || null;
      var d = e.data.data || {}; d.design = e.data.design;
      render(d);
    });
    if (window.parent !== window) window.parent.postMessage({ type: "wall-ready" }, location.origin);
    return;
  }

  var base = location.pathname.replace(/\/$/, "");
  function poll() { fetch(base + "/data", { cache: "no-store" }).then(function (r) { if (r.status === 404) location.reload(); return r.ok ? r.json() : null; }).then(function (d) { if (d) render(d); }).catch(function () {}); }
  function connect() {
    if (!window.EventSource) { setInterval(poll, 60000); return; }
    var es = new EventSource(base + "/events");
    es.onmessage = function (e) { try { render(JSON.parse(e.data)); } catch (err) { /* ignore a bad message */ } };
    es.addEventListener("gone", function () { es.close(); location.reload(); });
    es.onerror = function () { es.close(); setTimeout(connect, 15000); poll(); };
  }
  render(data);
  connect();
})();
</script>
</body>
</html>
