<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  /* The wall is laid out on a 1920 x 1080 stage that is scaled to fit any screen.
     Two screens take turns: "overview" (big numbers and a tile per channel) and "stories"
     (today's best items in a race, risers and goals). */
  :root {
    --bg: #060B16; --glow: #2FB8FF; --text: #D8F3FF; --dim: rgba(216, 243, 255, 0.58); --faint: rgba(216, 243, 255, 0.28);
    --good: #3CCB7F; --bad: #FF6B6F; --warn: #FFB86B;
    --display: "Space Grotesk", Inter, system-ui, sans-serif; --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    background: radial-gradient(1200px 520px at 12% -12%, color-mix(in srgb, var(--glow) 20%, transparent), transparent 62%),
                radial-gradient(1000px 560px at 100% 112%, color-mix(in srgb, #E14FD0 13%, transparent), transparent 62%), var(--bg); }
  #stage::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(color-mix(in srgb, var(--glow) 6%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--glow) 6%, transparent) 1px, transparent 1px);
    background-size: 64px 64px; -webkit-mask-image: linear-gradient(to bottom, black, transparent 72%); mask-image: linear-gradient(to bottom, black, transparent 72%); }
  .pg { position: absolute; inset: 0 0 48px; padding: 40px 64px 0; opacity: 0; visibility: hidden; transition: opacity 0.9s ease, visibility 0s linear 0.9s; }
  .pg.on { opacity: 1; visibility: visible; transition: opacity 0.9s ease; }
  .num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 0.92; }
  .lbl { font: 600 18px var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .chip { font: 700 15px var(--mono); letter-spacing: 0.06em; padding: 4px 10px; border-radius: 7px; border: 1px solid currentColor; white-space: nowrap; }
  .pill { font: 700 20px var(--mono); padding: 4px 12px; border-radius: 999px; white-space: nowrap; color: var(--dim); background: rgba(255,255,255,0.06); }
  .pill.up { color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }
  .pill.down { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
  .hdr { display: flex; align-items: center; justify-content: space-between; gap: 32px; height: 96px; }
  .brand { display: flex; align-items: center; gap: 22px; min-width: 0; }
  .brand h1, .brand h2 { margin: 0; font: 700 58px var(--display); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand h2 em { font-style: normal; color: var(--glow); }
  .brand .app { font: 500 21px var(--body); color: var(--dim); letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; }
  .brand .sub { font: 500 22px var(--body); color: var(--dim); margin-top: 6px; }
  .clock { font: 600 90px var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; text-shadow: 0 0 30px color-mix(in srgb, var(--glow) 50%, transparent); }
  .livedot { flex: none; width: 18px; height: 18px; border-radius: 50%; background: #FF3B5C; animation: ping 1.6s infinite; }
  .livedot.off { background: #556; animation: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255,59,92,0.7); } 80%, 100% { box-shadow: 0 0 0 18px rgba(255,59,92,0); } }
  svg.sp { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; pointer-events: none; }

  /* ---- overview ---- */
  .a { display: grid; grid-template-rows: 96px 236px minmax(0, 1fr) 62px; gap: 22px; }
  .a.noticker { grid-template-rows: 96px 236px minmax(0, 1fr); }
  .a.noticker .ticker { display: none; }
  .heroes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  .kpi { position: relative; overflow: hidden; border-radius: 22px; padding: 26px 32px; border: 1px solid color-mix(in srgb, var(--glow) 30%, transparent);
    background: linear-gradient(160deg, color-mix(in srgb, var(--glow) 13%, transparent), rgba(6,11,22,0.35) 62%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  .kpi .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; position: relative; z-index: 1; }
  .kpi .sub { color: var(--faint); font: 500 17px var(--body); margin-top: 4px; }
  .kpi .num { font-size: 124px; margin-top: 18px; position: relative; z-index: 1; text-shadow: 0 0 40px color-mix(in srgb, var(--glow) 55%, transparent); }
  .kpi svg.sp { height: 140px; }
  .tiles { display: grid; gap: 22px; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 2), minmax(0, 1fr)); min-height: 0; }
  .tile { position: relative; overflow: hidden; border-radius: 20px; padding: 22px 26px; border: 1px solid rgba(255,255,255,0.07); min-width: 0;
    background: radial-gradient(420px 220px at 0% 0%, color-mix(in srgb, var(--c) 26%, transparent), transparent 70%), rgba(10,18,34,0.82); }
  .tile .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .tile .name { display: flex; gap: 12px; align-items: center; font: 600 25px var(--display); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .name i { flex: none; width: 14px; height: 14px; border-radius: 4px; background: var(--c); box-shadow: 0 0 16px var(--c); }
  .tile .chip { color: var(--c); }
  .tile .chip.old { color: var(--warn); }
  .tile .chip.off { color: var(--faint); }
  .tile .mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 16px; position: relative; z-index: 1; }
  .tile .num { font-size: 84px; }
  .tiles.wide .tile .name { font-size: 22px; } .tiles.wide .tile { padding: 20px 22px; }
  .tiles.r3 .tile .num { font-size: 62px; } .tiles.r1 .tile .num { font-size: 110px; }
  .tile .unit { font: 500 18px var(--body); color: var(--dim); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .fol { font: 600 16px var(--mono); color: var(--dim); margin-top: 6px; white-space: nowrap; }
  .tile .fol b { color: var(--good); } .tile .fol b.down { color: var(--bad); }
  .tile svg.sp { height: 54px; opacity: 0.8; }
  .ring { flex: none; width: 88px; height: 88px; position: relative; margin-bottom: 22px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle.v { transition: stroke-dashoffset 1.2s ease; }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 19px var(--mono); }
  .ring small { position: absolute; left: -20px; right: -20px; bottom: -22px; text-align: center; font: 600 12px var(--body); letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; }
  .empty { grid-column: 1 / -1; grid-row: 1 / -1; display: grid; place-items: center; color: var(--dim); font-size: 32px; }
  .ticker { border-radius: 16px; border: 1px solid color-mix(in srgb, var(--glow) 25%, transparent); background: color-mix(in srgb, var(--glow) 6%, transparent); overflow: hidden; display: flex; align-items: center; }
  .ticker .tag { position: relative; z-index: 2; flex: none; height: 100%; display: flex; align-items: center; padding: 0 24px; font: 700 18px var(--mono); letter-spacing: 0.12em; color: var(--bg); background: var(--glow); box-shadow: 14px 0 24px var(--bg); }
  .ticker .track { display: flex; gap: 72px; white-space: nowrap; padding-left: 48px; font: 500 24px var(--body); animation: marquee var(--dur, 60s) linear infinite; }
  .ticker .track b { font-family: var(--display); }
  .ticker .track .k { font: 700 17px var(--mono); }
  .ticker .track .au { color: var(--dim); }
  @keyframes marquee { to { transform: translateX(-50%); } }

  /* ---- stories ---- */
  .d { display: grid; grid-template-columns: minmax(0, 1fr) 520px; grid-template-rows: 96px minmax(0, 1fr); gap: 26px 40px; }
  .d .hdr { grid-column: 1 / 3; }
  .race { position: relative; min-width: 0; }
  .rr { position: absolute; left: 0; right: 0; height: 74px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: center; transition: top 0.9s cubic-bezier(.2,.8,.2,1), opacity 0.6s; }
  .rr .pos { font: 700 40px var(--mono); color: var(--faint); text-align: right; }
  .rr .pos.top3 { color: var(--text); }
  .rr .track { position: relative; height: 100%; min-width: 0; }
  .rr .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 14px; transition: width 1.2s cubic-bezier(.2,.8,.2,1);
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 18%, transparent), color-mix(in srgb, var(--c) 68%, transparent)); box-shadow: 0 0 30px color-mix(in srgb, var(--c) 32%, transparent); }
  .rr .fill::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 40%; max-width: 90px; border-radius: 0 14px 14px 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 60%, white)); opacity: 0.55; }
  .rr .txt { position: absolute; left: 18px; right: 210px; top: 0; bottom: 0; display: flex; align-items: center; gap: 16px; min-width: 0; }
  .rr .k { flex: none; font: 700 15px var(--mono); padding: 5px 9px; border-radius: 6px; background: var(--c); color: #050A14; }
  .rr .tt { font: 600 25px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .rr .au { font: 500 18px var(--body); color: color-mix(in srgb, var(--text) 66%, transparent); white-space: nowrap; flex: none; }
  .rr .val { position: absolute; right: 12px; top: 0; bottom: 0; display: flex; align-items: center; gap: 10px; }
  .rr .val .num { font-size: 40px; }
  .rr .mv { font: 700 18px var(--mono); width: 48px; text-align: center; color: var(--faint); }
  .rr .mv.up { color: var(--good); } .rr .mv.dn { color: var(--bad); }
  .side { display: flex; flex-direction: column; gap: 22px; min-width: 0; min-height: 0; }
  .box { border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); background: rgba(10,18,34,0.78); padding: 22px 28px; min-width: 0; }
  .box h3 { margin: 0 0 14px; font: 600 18px var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .big { text-align: center; border-color: color-mix(in srgb, var(--glow) 30%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--glow) 14%, transparent), rgba(6,11,22,0.5)); display: grid; gap: 10px; justify-items: center; }
  .big .num { font-size: 112px; text-shadow: 0 0 40px color-mix(in srgb, var(--glow) 50%, transparent); }
  .big .y { font: 500 19px var(--body); color: var(--dim); }
  .mom { display: grid; gap: 12px; }
  .mom div { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
  .mom .k { font: 700 13px var(--mono); padding: 4px 8px; border-radius: 6px; background: var(--c); color: #050A14; }
  .mom .tt { font: 600 20px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mom b { font: 700 21px var(--mono); color: var(--good); }
  .goal { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
  .goal + .goal { margin-top: 18px; }
  .goal .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 600 21px var(--display); }
  .goal .gh span:first-child { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .goal .gh span:last-child { font: 500 17px var(--mono); color: var(--dim); white-space: nowrap; }
  .goal .gb { position: relative; height: 16px; border-radius: 8px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .goal .gb b { position: absolute; inset: 0 auto 0 0; border-radius: 8px; transition: width 1.2s; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 40%, transparent), var(--c)); box-shadow: 0 0 16px var(--c); overflow: hidden; }
  .goal .gb b::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent); animation: shine 2.8s infinite; transform: translateX(-100%); }
  @keyframes shine { to { transform: translateX(100%); } }
  .goal small { font: 500 16px var(--body); color: var(--dim); }
  .goal small.good { color: var(--good); } .goal small.bad { color: var(--warn); }

  /* ---- footer: freshness and which screen is next ---- */
  footer { position: absolute; left: 64px; right: 64px; bottom: 14px; height: 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; font: 500 16px var(--body); color: var(--dim); }
  .stale { color: var(--warn); }
  .dots { display: flex; gap: 10px; align-items: center; }
  .dots i { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; display: block; }
  .dots i b { display: block; height: 100%; width: 0; background: var(--glow); box-shadow: 0 0 10px var(--glow); }
  @media (prefers-reduced-motion: reduce) {
    .livedot, .ticker .track, .goal .gb b::after { animation: none; }
    .pg, .rr, .rr .fill, .ring circle.v, .goal .gb b { transition: none; }
  }
</style>
</head>

<div id="stage">
  <section class="pg a" id="pg-overview">
    <div class="hdr"><div class="brand"><span class="livedot" id="livedot"></span><h1 id="title">__TITLE__</h1><span class="app" id="app"></span></div><div class="clock"></div></div>
    <div class="heroes" id="heroes"></div>
    <div class="tiles" id="tiles"></div>

    <div class="race" id="race"></div>
    <div class="side">
      <div class="box big"><span class="lbl" id="bigLbl"></span><span class="num" id="bigNum">0</span><span class="y" id="bigY"></span></div>
      <div class="box" id="momBox"><h3 id="momTitle"></h3><div class="mom" id="mom"></div></div>
      <div class="box" id="goalBox"><h3 id="goalTitle"></h3><div id="goals"></div></div>
    </div>
  </section>
  <footer><span id="updated"></span><span class="dots" id="dots"></span></footer>
</div>

    if (diff <= 0) return unit + " " + T.today;
    if (diff === 1) return unit + " " + T.yesterday;
    return unit + " " + T.on + " " + day.toLocaleDateString(lang, { weekday: "short", day: "numeric", month: "short" });
  }

  /* ---------- overview ---------- */
  var heroes = [
    { key: "live", label: T.liveNow },
    { key: "views", label: T.viewsToday, sub: T.allChannels },
    { key: "inter", label: T.interToday, sub: T.interSub }
  ];
  heroes.forEach(function (h) {
    h.node = el('<div class="kpi"><div class="row"><div><div class="lbl">' + esc(h.label) + '</div><div class="sub"></div></div><span class="chipwrap"></span></div><div class="num">0</div>' + sparkSvg("var(--glow)", 140, true) + "</div>");
    $("heroes").appendChild(h.node);
  });
  // The gradient stop does not take a CSS variable everywhere: set the real colour once known.
  function heroColor(c) { $("heroes").querySelectorAll("stop").forEach(function (s) { s.setAttribute("stop-color", c); }); $("heroes").querySelectorAll(".ln").forEach(function (s) { s.setAttribute("stroke", c); }); }

  function tileFor(t) {
    var html = '<div class="tile" style="--c:' + esc(t.color) + '"><div class="top"><div class="name"><i></i><span></span></div><span class="chip"></span></div>' +
      '<div class="mid"><div style="min-width:0"><div class="num">0</div><div class="unit"></div><div class="fol"></div></div>' +
      '<div class="ring" hidden><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>' +
      '<circle class="v" cx="46" cy="46" r="38" fill="none" stroke="' + esc(t.color) + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="238.8" style="filter:drop-shadow(0 0 6px ' + esc(t.color) + ')"/></svg><span></span><small>' + esc(T.goal) + "</small></div></div>" +
      sparkSvg(t.color, 54, false) + "</div>";
    var n = el(html);
    n.querySelector(".name span").textContent = t.name;
    return n;
  }

  function overview(d) {
    var tiles = d.channels.map(function (c) { return { id: "c" + c.id, live: true, src: c, color: c.color, name: c.name }; })
      .concat((d.socials || []).map(function (s) { return { id: "s" + s.id, live: false, src: s, color: s.color, name: s.name }; }));
    var box = $("tiles"), ids = tiles.map(function (t) { return t.id + t.color; }).join(",");
    if (box.dataset.ids !== ids) {
      box.dataset.ids = ids; box.innerHTML = "";
      var n = tiles.length, rows = n <= 4 ? 1 : n <= 10 ? 2 : 3, cols = Math.max(1, Math.ceil(n / rows));
      box.style.setProperty("--cols", cols); box.style.setProperty("--rows", rows); box.className = "tiles r" + rows + (cols >= 5 ? " wide" : "");
      if (!n) box.appendChild(el('<div class="empty">' + esc(T.none) + "</div>"));
      tiles.forEach(function (t) { t.node = tileFor(t); t.node.id = "t-" + t.id; box.appendChild(t.node); });
    }
    tiles.forEach(function (t) {
      var node = $("t-" + t.id); if (!node) return;
      var s = t.src, chip = node.querySelector(".chip"), ring = node.querySelector(".ring");
      if (t.live) {
        count(node.querySelector(".num"), s.now);
        node.querySelector(".unit").textContent = T[s.unit] + (s.unit !== "views" ? " · " + T.peak + " " + fmt(s.peak) : "");
        node.querySelector(".fol").textContent = "";
        chip.textContent = s.online ? T.onAir : T.offAir; chip.className = "chip" + (s.online ? "" : " off");
        spark(node.querySelector("svg.sp"), s.bars, 54, 6);
        ring.hidden = true;
      } else {
        count(node.querySelector(".num"), s.value);
        node.querySelector(".unit").textContent = dayLabel(s.day, s.measure);
        var fol = node.querySelector(".fol");
        if (s.followers != null) {
          var ch = s.followers_change;
          fol.innerHTML = esc(plain.format(s.followers)) + " " + esc(T.followers) + (ch ? ' <b class="' + (ch < 0 ? "down" : "") + '">' + (ch < 0 ? "▼ " : "▲ ") + esc(plain.format(Math.abs(ch))) + "</b>" : "");
        } else fol.textContent = "";
        var a = ago(s.updated); chip.textContent = a.text; chip.className = "chip" + (a.old ? " old" : "");
        spark(node.querySelector("svg.sp"), s.days, 54, 6);
        ring.hidden = !s.goal;
        if (s.goal) {
          var f = Math.max(0, Math.min(1, s.goal.progress / 100));
          ring.querySelector("circle.v").style.strokeDashoffset = 238.8 * (1 - f);
          ring.querySelector("span").textContent = Math.round(f * 100) + "%";
        }
      }
    });

    var streams = d.channels.filter(function (c) { return c.unit !== "views"; });
    var live = heroes[0], tot = d.totals || {};
    var liveBars;
    if (streams.length) {
      count(live.node.querySelector(".num"), tot.live);
      live.node.querySelector(".sub").textContent = T.liveSub;
      liveBars = streams[0].bars.map(function (_, i) { return streams.reduce(function (sum, c) { return sum + (c.bars[i] || 0); }, 0); });
    } else {
      var webs = d.channels.filter(function (c) { return c.unit === "views"; });
      count(live.node.querySelector(".num"), webs.reduce(function (s, c) { return s + c.now; }, 0));
      live.node.querySelector(".sub").textContent = T.liveWeb;
      liveBars = webs.length ? webs[0].bars : [];
    }
    live.node.querySelector(".chipwrap").innerHTML = '<span class="pill up">● ' + esc(T.onAir) + "</span>";
    spark(live.node.querySelector("svg.sp"), liveBars, 140, 14);
    [[heroes[1], tot.views_today, tot.views_yesterday, tot.views_days], [heroes[2], tot.interactions_today, tot.interactions_yesterday, tot.interactions_days]].forEach(function (x) {
      count(x[0].node.querySelector(".num"), x[1]);
      x[0].node.querySelector(".sub").textContent = x[0].sub + " · " + T.yesterday + " " + fmt(x[2]);
      x[0].node.querySelector(".chipwrap").innerHTML = "";
      spark(x[0].node.querySelector("svg.sp"), x[3], 140, 14);
    });
    $("livedot").className = "livedot" + (streams.some(function (c) { return c.online; }) || d.channels.length ? "" : " off");

    var top = d.top || [];
    $("pg-overview").classList.toggle("noticker", !top.length);
    $("tickerTag").textContent = T.top;
    var items = top.slice(0, 8).map(function (t) {
      return '<span><span class="k" style="color:' + esc(t.color) + '">' + esc(KIND[t.kind] || t.kind.toUpperCase()) + "</span>&nbsp; <b>" + esc(fmt(t.value)) + "</b>&nbsp; " + esc(t.title) + (t.author ? ' <span class="au">· ' + esc(t.author) + "</span>" : "") + "</span>";
    }).join("");
    var track = $("track");
    if (track.dataset.html !== items) {
      track.dataset.html = items; track.innerHTML = items + items;
      track.style.setProperty("--dur", Math.max(30, top.slice(0, 8).length * 9) + "s");
    }
  }

  /* ---------- stories ---------- */
  var rows = {}, lastRank = {};
  function stories(d) {
    var top = d.top || [], race = $("race");
    var yesterday = d.top_day && d.today && d.top_day !== d.today;
    $("storiesTitle").innerHTML = yesterday ? T.storiesYesterday : T.storiesToday;
    $("storiesSub").textContent = T.storiesSub;
    var maxV = Math.max.apply(null, top.map(function (t) { return t.value; }).concat([1]));
    var seen = {};
    top.forEach(function (t, i) {
      var key = String(t.id); seen[key] = true;
      var r = rows[key];
      if (!r) {
        r = el('<div class="rr" style="--c:' + esc(t.color) + ';top:' + (i * 84) + 'px"><span class="pos"></span><div class="track"><div class="fill" style="width:0"></div>' +
          '<div class="txt"><span class="k"></span><span class="tt"></span><span class="au"></span></div><div class="val"><span class="num">0</span><span class="mv"></span></div></div></div>');
        race.appendChild(r); rows[key] = r;
      }
      r.style.top = (i * 84) + "px"; r.style.opacity = "1";
      var pos = r.querySelector(".pos"); pos.textContent = i + 1; pos.className = "pos" + (i < 3 ? " top3" : "");
      r.querySelector(".k").textContent = KIND[t.kind] || t.kind.toUpperCase();
      r.querySelector(".tt").textContent = t.title;
      r.querySelector(".au").textContent = t.author || "";
      r.querySelector(".fill").style.width = (28 + t.value / maxV * 72) + "%";
      count(r.querySelector(".num"), t.value);
      var prev = lastRank[key], mv = r.querySelector(".mv");
      if (prev == null || prev === i) { mv.className = "mv"; mv.textContent = "–"; }
      else { mv.className = "mv " + (prev > i ? "up" : "dn"); mv.textContent = (prev > i ? "▲" : "▼") + Math.abs(prev - i); }
    });
    Object.keys(rows).forEach(function (k) { if (!seen[k]) { rows[k].remove(); delete rows[k]; } });
    lastRank = {}; top.forEach(function (t, i) { lastRank[String(t.id)] = i; });

    var tot = d.totals || {};
    $("bigLbl").textContent = T.bigLbl;
    count($("bigNum"), tot.views_today);
    $("bigY").textContent = T.yesterday + " " + fmt(tot.views_yesterday);

    var rising = d.rising || [];
    $("momBox").hidden = !rising.length;
    $("momTitle").textContent = T.rising;
    $("mom").innerHTML = rising.map(function (t) {
      return '<div style="--c:' + esc(t.color) + '"><span class="k">' + esc(KIND[t.kind] || t.kind.toUpperCase()) + '</span><span class="tt">' + esc(t.title) + "</span><b>+" + esc(fmt(t.gain)) + "</b></div>";
    }).join("");

    var goals = (d.goals || []).slice(0, rising.length ? 3 : 5);
    $("goalBox").hidden = !goals.length;
    $("goalTitle").textContent = T.goals;
    var socials = {}; (d.socials || []).forEach(function (s) { socials[s.id] = s; });
    $("goals").innerHTML = goals.map(function (g) {
      var one = g.source_ids.length === 1 && socials[g.source_ids[0]];
      var color = one ? one.color : "var(--glow)";
      var note = g.status === "reached" ? '<small class="good">✓ ' + esc(T.reached) + "</small>"
        : g.period && g.period !== "none" ? "<small" + (g.status === "behind" ? ' class="bad"' : "") + ">" + esc(T[g.period]) + " · " + esc(g.status === "behind" ? T.behind : T.onTrack) + "</small>"
        : g.eta ? "<small" + (g.status === "behind" ? ' class="bad"' : "") + ">" + esc(T.expected) + " " + esc(new Date(g.eta).toLocaleDateString(lang, { day: "numeric", month: "short", year: "numeric" })) + (g.status === "behind" ? " · " + esc(T.behind) : "") + "</small>"
        : "<small" + (g.status === "behind" ? ' class="bad"' : "") + ">" + esc(g.status === "behind" ? T.behind : T.onTrack) + "</small>";
      return '<div class="goal" style="--c:' + esc(color) + '"><div class="gh"><span>' + esc(g.name) + "</span><span>" + esc(plain.format(g.current)) + " / " + esc(plain.format(g.target)) +
        '</span></div><div class="gb"><b style="width:' + Math.max(2, Math.min(100, g.progress)) + '%"></b></div>' + note + "</div>";
    }).join("");
  }

  /* ---------- screens taking turns ---------- */
  var current = null, startedAt = 0;
  // ?screen=overview or ?screen=stories pins one screen, e.g. for a second TV next to the first.
  var pinned = (/[?&]screen=(overview|stories)\b/.exec(location.search) || [])[1];
  function screens(d) {
    var layout = pinned || d.layout || "rotate", hasTop = (d.top || []).length > 0;
    if (layout === "stories" && hasTop) return ["stories"];
    if (layout === "rotate" && hasTop) return ["overview", "stories"];
    return ["overview"];
  }
  function show(name) {
    current = name; startedAt = performance.now();
    ["overview", "stories"].forEach(function (n) { $("pg-" + n).classList.toggle("on", n === name); });
    drawDots();
  }
  function drawDots() {
    var list = screens(data), dots = $("dots");
    if (list.length < 2) { dots.innerHTML = ""; return; }
    dots.innerHTML = list.map(function (n) { return "<i><b" + (n === current ? ' id="bar"' : "") + "></b></i>"; }).join("");
  }
  function rotate() {
    var list = screens(data), secs = Math.max(10, data.rotate_seconds || 30);
    if (list.indexOf(current) < 0) show(list[0]);
    else if (list.length > 1 && performance.now() - startedAt >= secs * 1000) show(list[(list.indexOf(current) + 1) % list.length]);
    var bar = $("bar");
    if (bar) bar.style.width = Math.min(100, (performance.now() - startedAt) / (secs * 10)) + "%";
  }

  function render(d) {
    data = d;
    var colors = d.colors || {};
    if (colors.background) rootStyle.setProperty("--bg", colors.background);
    if (colors.glow) { rootStyle.setProperty("--glow", colors.glow); heroColor(colors.glow); } else heroColor("#2FB8FF");
    if (colors.text) rootStyle.setProperty("--text", colors.text);
    $("title").textContent = d.title; document.title = d.title;
    $("app").textContent = d.app_name || "";
    d.channels = d.channels || [];
    overview(d);
    stories(d);
    if (screens(d).indexOf(current) < 0) show(screens(d)[0]); else drawDots();
    tick();
  }

  function tick() {
    var now = new Date();
    var clock = now.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" });
    document.querySelectorAll(".clock").forEach(function (c) { c.textContent = clock; });
    var at = new Date(data.at), age = (now - at) / 1000;
    var u = $("updated");
    u.textContent = age > 300 ? T.stale : T.updated + " " + at.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + " · " + T.note;
    u.className = age > 300 ? "stale" : "";
  }

  var base = location.pathname.replace(/\/$/, "");
  function poll() { fetch(base + "/data", { cache: "no-store" }).then(function (r) { if (r.status === 404) location.reload(); return r.ok ? r.json() : null; }).then(function (d) { if (d) render(d); }).catch(function () {}); }
  function connect() {
    if (!window.EventSource) { setInterval(poll, 60000); return; }
    var es = new EventSource(base + "/events");
    es.onmessage = function (e) { try { render(JSON.parse(e.data)); } catch (err) { /* ignore a bad message */ } };
    es.addEventListener("gone", function () { es.close(); location.reload(); });
    es.onerror = function () { es.close(); setTimeout(connect, 15000); poll(); };
  }
  render(data);
  setInterval(tick, 1000);
  setInterval(rotate, 250);
  connect();
})();
</script>
</body>
</html>
