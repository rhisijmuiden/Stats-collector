[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stats-collector"
dynamic = ["version"]
description = "Self-hosted statistics and reporting platform for media teams"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=42",
  "httpx>=0.27",
  "packaging>=24",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
stats-collector = "stats_collector.cli:main"

[tool.setuptools.dynamic]
version = { attr = "stats_collector.__version__" }

[tool.setuptools.packages.find]
include = ["stats_collector*"]

[tool.setuptools.package-data]
stats_collector = ["locales/*.json", "migrations/*.py", "migrations/versions/*.py", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
