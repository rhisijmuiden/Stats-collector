site_name: Stats Collector
site_description: Manual for Stats Collector, the self-hosted statistics platform
site_url: https://rhisijmuiden.github.io/stats-collector/
repo_url: https://github.com/rhisijmuiden/stats-collector
edit_uri: edit/develop/docs/manual/
docs_dir: docs/manual
site_dir: site

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - images/brand.css

extra:
  version:
    provider: mike

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: nl
          name: Nederlands
          build: true

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - README.md
  - installation.md
  - reverse-proxy.md
  - users-and-roles.md
  - branding.md
  - email.md
  - backup.md
  - updates.md
  - Platforms:
      - microsoft-365.md
      - owncast-icecast.md
      - wordpress.md
      - youtube.md
      - meta.md
  - troubleshooting.md
